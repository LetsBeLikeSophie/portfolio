<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>포에버 채팅</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0b09; --panel:#17130f; --panel2:#1f1a14; --line:#3a2f22;
    --gold:#e6c36a; --gold-dim:#a88b45; --text:#ece4d6; --body:#c9bfae; --muted:#9b8f7c;
    --alliance:#3f7fd9; --horde:#c8372d; --danger:#ff6b5b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:"Noto Sans KR",system-ui,sans-serif;-webkit-text-size-adjust:100%}
  body{background:radial-gradient(1200px 600px at 50% -200px,#2a1f12 0%,var(--bg) 70%)}
  button,input,select{font:inherit;color:inherit}
  .hidden{display:none!important}

  /* 아이콘 */
  .ic{width:18px;height:18px;border-radius:4px;flex:none;vertical-align:-4px;object-fit:cover;
    box-shadow:0 0 0 1px #0008;background:#000}
  .ic.lg{width:28px;height:28px;border-radius:6px;vertical-align:middle}
  .ic.fb{display:inline-grid;place-items:center;font-size:10px;font-weight:700;color:#fff;background:#3a2f22}
  .ic.fb.alliance{background:var(--alliance)} .ic.fb.horde{background:var(--horde)}
  .icons{display:inline-flex;gap:3px;margin-right:5px;vertical-align:-4px}

  /* ---------- 입장 ---------- */
  #join{min-height:100%;display:flex;align-items:center;justify-content:center;
    padding:calc(24px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom))}
  .card{width:100%;max-width:440px;background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--line);border-radius:14px;padding:22px 20px;
    box-shadow:0 0 0 1px #0006 inset,0 20px 60px #0008}
  .logo{font-family:Cinzel,serif;color:var(--gold);font-size:28px;letter-spacing:.06em;text-align:center;margin:0}
  .sub{color:var(--muted);text-align:center;font-size:13px;margin:6px 0 18px}
  label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}
  input,select{width:100%;background:#0a0806;border:1px solid var(--line);border-radius:9px;
    padding:11px 12px;outline:none;font-size:16px}
  input:focus,select:focus{border-color:var(--gold-dim)}
  .row{display:flex;gap:10px}.row>div{flex:1}
  .btn{width:100%;margin-top:18px;border:1px solid #8a6a26;border-radius:10px;padding:12px;cursor:pointer;
    background:linear-gradient(180deg,#c9a24c,#8c6b25);color:#1a1205;font-weight:700;letter-spacing:.02em}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.ghost{background:none;color:var(--gold);border-color:var(--line);font-weight:500}
  .btn.bnet{margin-top:4px;background:linear-gradient(180deg,#1a8dff,#0060c7);border-color:#0a55a8;color:#fff}
  .btn.sm{margin-top:10px;padding:9px;font-size:14px}
  .note{font-size:12.5px;color:var(--muted);margin-top:12px;line-height:1.5}
  .err{color:var(--danger);font-size:13px;margin-top:10px;min-height:1em}
  .or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:18px 0 6px}
  .or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
  details summary{cursor:pointer;color:var(--muted);font-size:13px;text-align:center;list-style:none;padding:6px}
  details summary::-webkit-details-marker{display:none}
  .legal{font-size:11px;color:#6d6354;text-align:center;margin-top:16px;line-height:1.5}

  .pick{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin-top:8px;padding:10px 12px;
    background:#0a0806;border:1px solid var(--line);border-radius:10px;cursor:pointer}
  .pick:hover,.pick:focus-visible{border-color:var(--gold-dim);outline:none}
  .pick .who2{flex:1;min-width:0}
  .pick .nm{font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pick .sub2{font-size:12px;color:var(--muted)}
  .pick.off{opacity:.55}
  .srv.unk{color:var(--muted);border-style:dashed}
  .srv{font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--gold);white-space:nowrap}
  .srv.pvp{color:#ff8a7a;border-color:#5a2a24}

  /* ---------- 채팅 ---------- */
  #chat{position:fixed;inset:0;display:flex;flex-direction:column}
  header{padding:calc(10px + env(safe-area-inset-top)) 12px 8px;background:linear-gradient(180deg,#1b150e,#120e0a);
    border-bottom:1px solid var(--line)}
  .top{display:flex;align-items:center;gap:8px}
  .title{font-family:Cinzel,serif;color:var(--gold);font-size:18px;letter-spacing:.05em}
  .top .srv{margin-right:auto}
  .me{display:flex;align-items:center;gap:6px;font-size:13px;background:#0006;border:1px solid var(--line);
    padding:4px 10px 4px 5px;border-radius:999px;cursor:pointer;max-width:58%}
  .me span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
  .chiprow{display:flex;align-items:center;gap:8px;margin-top:9px}
  .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;flex:1;min-width:0}
  .sw{flex:none;display:flex;align-items:center;gap:6px;background:none;border:0;padding:0 2px;cursor:pointer;
    font-size:13px;font-weight:700;color:var(--muted)}
  .sw .track{width:34px;height:20px;border-radius:999px;background:#3a2f22;position:relative;transition:background .15s}
  .sw .knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#bbb;transition:left .15s}
  .sw[aria-checked="true"] .knob{left:16px;background:#fff}
  .sw.horde[aria-checked="true"] .track{background:var(--horde)}
  .sw.alliance[aria-checked="true"] .track{background:var(--alliance)}
  .sw.horde[aria-checked="true"]{color:#ffb0a6} .sw.alliance[aria-checked="true"]{color:#a9c8ff}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1px solid var(--line);background:#0006;border-radius:999px;padding:5px 11px;
    font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
  .chip.on{background:#3a2c14;border-color:var(--gold-dim);color:var(--gold)}
  .chip.fac.on{background:#2a1416;border-color:#7a2f2a;color:#ffb0a6}
  .chip.fac.alliance.on{background:#132036;border-color:#2f5a9a;color:#a9c8ff}
  .online{font-size:11.5px;color:var(--muted);text-align:center;padding:5px 0}
  .online b{color:#7bd17b;font-weight:500}

  #list,#tList{flex:1;overflow-y:auto;padding:6px 10px;-webkit-overflow-scrolling:touch;font-size:15px;line-height:1.5}
  .msg{padding:5px 4px;word-break:break-word;border-radius:8px}
  .msg.tap{cursor:pointer}
  .msg.ment{background:#3a2c1455;box-shadow:inset 3px 0 0 var(--gold)}
  .msg.tap:active{background:#ffffff08}
  .msg .time{color:#6d6354;font-size:11px;margin-right:5px}
  .msg .who{font-weight:700}
  .msg .lv{color:#6d6354;font-size:11px;margin-left:3px}
  .msg .lang{color:var(--muted);font-style:italic;margin-right:4px}
  .msg .text{color:var(--body)}
  .msg.foreign .text{font-style:italic;color:#a99e8a}
  .msg.emote{color:#ff9f45;font-style:normal}
  .msg.emote .etext{color:#ff9f45}
  .emotes{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .emotes button{border:1px solid #5a3a1a;background:#2a1a0c;color:#ffb46b;border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:0 6px;border-radius:5px;margin-right:5px;vertical-align:1px}
  .tag.question{background:#183a4a;color:#8fd6f5}
  .tag.trade{background:#3d3412;color:#f0d36b}
  .tag.guild{background:#2a1f45;color:#c7b1ff}
  .tag.party{background:#173a22;color:#8ee6a6}
  .replies:empty{display:none}
  .replies{display:inline-block;margin-left:6px;font-size:12px;color:var(--gold-dim);white-space:nowrap}
  .sys{color:#e0b34a;font-size:13px;text-align:center;padding:8px 0;opacity:.85}
  .empty{color:var(--muted);text-align:center;margin-top:40px;font-size:14px;line-height:1.6}

  form.send{display:flex;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);background:#120e0a}
  form.send input{flex:1;min-width:0}
  form.send select{width:auto;padding:0 8px;font-size:13px;color:var(--gold)}
  form.send button{border:1px solid #8a6a26;border-radius:9px;padding:0 14px;flex:none;
    background:linear-gradient(180deg,#c9a24c,#8c6b25);color:#1a1205;font-weight:700;cursor:pointer}
  form.send{position:relative}
  .mbox{position:absolute;left:10px;right:10px;bottom:calc(100% + 4px);background:var(--panel2);border:1px solid var(--gold-dim);
    border-radius:10px;overflow:hidden;box-shadow:0 -8px 24px #000a;z-index:5}
  form.send .mbox .mi{display:flex;justify-content:space-between;align-items:center;width:100%;padding:11px 12px;
    background:none;border:0;border-radius:0;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;
    font-size:15px;font-weight:400;color:var(--text);flex:none}
  form.send .mbox .mi:last-child{border-bottom:0}
  form.send .mbox .mi.on{background:#3a2c1488}
  .mi .md{font-size:11px;color:#7bd17b}
  .toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);
    background:#2a1d10;border:1px solid var(--gold-dim);padding:8px 14px;border-radius:9px;font-size:13px;
    opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;
    white-space:nowrap;width:max-content;max-width:calc(100vw - 24px);overflow:hidden;text-overflow:ellipsis}
  .toast.show{opacity:1}

  /* 답글 */
  #thread{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);z-index:6}
  #thread header .top button{background:none;border:0;color:var(--gold);font-size:15px;cursor:pointer;padding:4px 2px}
  #tList .msg:first-child{background:#ffffff08;border:1px solid var(--line);margin-bottom:8px;padding:8px}

  /* 프로필 카드 */
  #prof{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:9}
  #prof .card{border-radius:14px 14px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom));max-height:85vh;overflow-y:auto}
  .ph{display:flex;align-items:center;gap:12px}
  .ph .icons{margin:0}
  .ph .nm{font-size:19px;font-weight:700}
  .ph .meta2{font-size:13px;color:var(--muted);margin-top:2px}
  .acts{display:flex;gap:8px;margin-top:14px}
  .acts button{flex:1;border:1px solid var(--line);background:#0006;border-radius:9px;padding:9px 4px;
    font-size:13px;color:var(--gold);cursor:pointer}
  .acts button.warn{color:#ff9a8c}
  .recent{margin-top:14px;border-top:1px solid var(--line);padding-top:8px}
  .recent h4{margin:4px 0 6px;font-size:12px;color:var(--muted);font-weight:500}
  .recent .msg{font-size:14px}
  #newBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(68px + env(safe-area-inset-bottom));
    background:var(--gold);color:#1a1205;border:0;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;
    box-shadow:0 6px 20px #000a;cursor:pointer;z-index:4}

  /* 알림 */
  .bell{position:relative;background:#0006;border:1px solid var(--line);border-radius:999px;width:34px;height:34px;
    display:grid;place-items:center;color:var(--gold);cursor:pointer;flex:none;padding:0}
  .bdot{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;
    background:var(--danger);color:#fff;font-size:10px;font-weight:700;line-height:17px;text-align:center}
  #notif{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);z-index:7}
  #notif header .top button{background:none;border:0;color:var(--gold);font-size:15px;cursor:pointer;padding:4px 2px}
  #nList{flex:1;overflow-y:auto;padding:6px 10px}
  .ni{padding:10px 8px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px}
  .ni:active{background:#ffffff08}
  .ni.new{background:#3a2c1440}
  .ni .k{font-size:11.5px;color:var(--gold-dim);margin-bottom:3px}
  .ni .b{font-size:14.5px;line-height:1.5;color:var(--body);word-break:break-word}
  .ni .b.foreign{font-style:italic;color:#a99e8a}

  /* 시트 */
  #sheet{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:8}
  #sheet .card{border-radius:14px 14px 0 0;padding-bottom:calc(22px + env(safe-area-inset-bottom))}
</style>
</head>
<body>

<!-- 입장 화면 -->
<section id="join" class="hidden">
  <div class="card">
    <h1 class="logo">FOREVER CHAT</h1>
    <p class="sub">와우 포에버 실시간 채팅</p>

    <!-- 배틀넷 캐릭터 선택 -->
    <div id="pickBox" class="hidden">
      <label style="margin-top:0">캐릭터 선택 <span id="pkTag" style="color:var(--gold-dim)"></span></label>
      <div id="pickList"></div>
      <div class="err" id="pickErr"></div>
      <button class="btn ghost sm" id="refreshBtn" type="button">배틀넷에서 캐릭터 다시 불러오기</button>
    </div>

    <!-- 처음 화면 -->
    <div id="altBox">
      <button class="btn bnet" id="bnetBtn" type="button">배틀넷으로 로그인</button>
      <div class="err" id="bnetErr"></div>
      <p class="note" style="margin-top:2px;text-align:center">배틀넷 계정의 포에버 캐릭터로 입장해요</p>

    </div>

    <p class="note">다른 진영 사람이 쓴 채팅은 게임처럼 <b>공용어 / 오크어</b>로 바뀌어 보여요. 원문은 같은 진영에게만 전달되고, 메시지는 3일 뒤 지워져요.<br>감정 표현(<b>/인사</b>, <b>/춤</b> 등)은 상대 진영에게도 보여요.</p>
    <p class="legal">비공식 팬 사이트예요. World of Warcraft와 게임 이미지는 Blizzard Entertainment의 자산이며, 이 사이트는 블리자드와 관계없어요.</p>
  </div>
</section>

<!-- 채팅 화면 -->
<section id="chat" class="hidden">
  <header>
    <div class="top">
      <div class="title">FOREVER</div>
      <span class="srv" id="srvBadge"></span>
      <button class="bell" id="bellBtn" type="button" aria-label="알림"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="bdot hidden" id="bellDot"></span></button>
      <button class="me" id="meBtn" type="button"><span class="icons" id="meIcons"></span><span id="meName"></span></button>
    </div>
    <div class="chiprow">
      <div class="chips" id="chips"></div>
      <button type="button" class="sw" id="enemySw" role="switch" aria-checked="true">
        <span id="enemyLbl"></span><span class="track"><span class="knob"></span></span>
      </button>
    </div>
  </header>
  <div class="online" id="online">접속 중…</div>
  <div id="list"></div>
  <form class="send" id="send" autocomplete="off">
    <select id="tagSel" aria-label="말머리"></select>
    <input id="msgInput" maxlength="300" placeholder="메시지 입력" enterkeyhint="send">
    <button type="submit">전송</button>
  </form>
</section>

<!-- 답글 -->
<section id="thread" class="hidden">
  <header>
    <div class="top">
      <button type="button" id="tBack">‹ 채팅</button>
      <div style="flex:1;text-align:center;color:var(--gold);font-weight:700">답글</div>
      <span style="width:52px"></span>
    </div>
  </header>
  <div id="tList"></div>
  <form class="send" id="tSend" autocomplete="off">
    <input id="tInput" maxlength="300" placeholder="답글 입력" enterkeyhint="send">
    <button type="submit">답글</button>
  </form>
</section>

<!-- 알림함 -->
<section id="notif" class="hidden">
  <header>
    <div class="top">
      <button type="button" id="nBack">‹ 채팅</button>
      <div style="flex:1;text-align:center;color:var(--gold);font-weight:700">알림</div>
      <span style="width:52px"></span>
    </div>
  </header>
  <div id="nList"></div>
</section>

<div id="sheet" class="hidden">
  <div class="card">
    <div id="sheetInfo" style="font-size:15px;line-height:1.8"></div>
    <button class="btn" id="switchBtn" type="button">캐릭터 바꾸기</button>
    <button class="btn ghost sm" id="logoutBtn" type="button">로그아웃</button>
    <button class="btn ghost sm" id="closeSheet" type="button">닫기</button>
  </div>
</div>

<div id="prof" class="hidden">
  <div class="card">
    <div class="ph" id="pHead"></div>
    <div class="acts">
      <button type="button" id="pEmote">감정 표현</button>
      <button type="button" id="pCopy">이름 복사</button>
      <button type="button" id="pMute" class="warn">채팅 숨기기</button>
    </div>
    <div class="emotes hidden" id="pEmotes"></div>
    <button class="btn ghost sm" id="pClose" type="button">닫기</button>
  </div>
</div>

<button id="newBar" class="hidden" type="button">새 메시지 ↓</button>

<div class="toast" id="toast"></div>

/* ---------- 자동완성: /감정 표현, @이름 (감정 표현 대상은 양 진영, 그냥 @는 우리 진영만) ---------- */
let onlineUsers = new Map();
function mentionCandidates(q, allFactions){
  const seen=new Set(), out=[];
  const push=(u)=>{ if (!u.name || u.id===me.id || seen.has(u.name)) return; seen.add(u.name); out.push(u); };
  const ql=q.toLowerCase();
  const match=(n)=> !ql || n.toLowerCase().split(" ").some(w=>w.startsWith(ql)) || n.toLowerCase().startsWith(ql) || n.toLowerCase().includes(ql);
  const okF=(f)=> allFactions || f===me.faction;
  [...onlineUsers.values()].filter(u=>okF(u.faction) && match(u.name)).forEach(u=>push({ ...u, online:true }));
  [...cache].reverse().forEach(m=>{ if (m.tag!=="emote" && okF(m.sender_faction) && match(m.sender_name)) push({ id:m.player_id, name:m.sender_name, cls:m.sender_class, faction:m.sender_faction }); });
  return out.slice(0, 6);
}
function attachMention(input, allowEmote){
  const box=document.createElement("div"); box.className="mbox hidden";
  input.closest("form").appendChild(box);
  let items=[], sel=0, tok=null;
  const tokenAt=()=>{ const v=input.value.slice(0, input.selectionStart ?? input.value.length);
    if (allowEmote){
      let m=v.match(/^\/(\S*)$/); if (m) return { type:"emote", q:m[1], start:0, end:v.length };
      m=v.match(/^\/\S+\s+@?([^@\n]{0,20})$/); if (m) return { type:"user", all:true, q:m[1].trimStart(), start:v.length-m[0].length+m[0].search(/\s/)+1, end:v.length, bare:true };
    }
    const m=v.match(/@([^@\n]{0,20})$/);
    return m ? { type:"user", all:allowEmote && v.trimStart().startsWith("/"), q:m[1].trimStart(), start:v.length-m[0].length, end:v.length } : null; };
  const close=()=>{ box.classList.add("hidden"); items=[]; };
  const pick=(it)=>{ const t=tokenAt(); if (!t) return close();
    let ins;
    if (t.type==="emote") ins = "/" + it.key + " ";
    else ins = (t.bare ? "" : "@") + it.name + " ";
    if (t.bare) { const v=input.value; const pre=v.slice(0,t.end).replace(/\s+@?[^@\n]*$/, " "); input.value = pre + ins + v.slice(t.end); }
    else input.value = input.value.slice(0,t.start) + ins + input.value.slice(t.end);
    const pos=input.value.length; input.setSelectionRange(pos,pos); close(); input.focus();
    if (t.type==="emote") input.dispatchEvent(new Event("input")); };
  const render=()=>{ box.innerHTML="";
    items.forEach((it,i)=>{ const b=document.createElement("button"); b.type="button"; b.className="mi"+(i===sel?" on":"");
      const n=document.createElement("span"); n.style.fontWeight="700";
      const d=document.createElement("span"); d.className="md";
      if (tok.type==="emote"){ n.textContent="/"+it.key; n.style.color="#ffb46b"; d.textContent=it.solo.replace("{s}님이 ",""); d.style.color="var(--muted)"; }
      else { n.textContent=it.name; n.style.color=CLASS_COLOR[it.cls]||"";
        d.textContent=(it.faction!==me.faction ? (it.faction==="alliance"?"얼라 ":"호드 ") : "")+(it.online?"● 접속 중":""); }
      b.append(n,d); b.onmousedown=(e)=>{ e.preventDefault(); pick(it); }; box.appendChild(b); }); };
  input.addEventListener("input", ()=>{ tok=tokenAt();
    if (!tok) return close();
    if (tok.type==="emote") items=EMOTES.filter(e=>e.key.startsWith(tok.q)).slice(0,8);
    else items=mentionCandidates(tok.q, tok.all);
    sel=0;
    if (!items.length) return close(); box.classList.remove("hidden"); render(); });
  input.addEventListener("keydown", (e)=>{ if (box.classList.contains("hidden")) return;
    if (e.key==="ArrowDown"){ sel=(sel+1)%items.length; render(); e.preventDefault(); }
    else if (e.key==="ArrowUp"){ sel=(sel-1+items.length)%items.length; render(); e.preventDefault(); }
    else if (e.key==="Enter" || e.key==="Tab"){ pick(items[sel]); e.preventDefault(); }
    else if (e.key==="Escape") close(); });
  input.addEventListener("blur", ()=>setTimeout(close, 150));
}

let pendingRows=new Map(), flushTimer=null;
function queueOwn(row){ pendingRows.set(row.id,row); if (!flushTimer) flushTimer=setTimeout(flushBodies, 60); }
async function flushBodies(){
  const rows=pendingRows; pendingRows=new Map(); flushTimer=null;
  const ids=[...rows.keys()];
  const { data, error } = await sb.rpc("wow_bodies", { p_token: me.token, p_ids: ids });
  const map=new Map((data||[]).map(x=>[x.id,x.body]));
  ids.forEach(id=>{ const r=rows.get(id);
    if (map.has(id)) addMsg({ ...r, body: map.get(id), foreign_lang:false });
    else if (error) addMsg({ ...r, body: r.garbled, foreign_lang:false });
  });
}

function subscribe(){
  if (msgSub) sb.removeChannel(msgSub);
  msgSub = sb.channel("wow-messages-"+channel)
    .on("postgres_changes", { event:"INSERT", schema:"wow", table:"messages", filter:`channel=eq.${channel}` }, (p)=>{
      const r=p.new;
      if (r.tag==="emote") addMsg({ ...r, body: r.garbled, foreign_lang:false });
      else if (r.sender_faction===me.faction) queueOwn(r);
      else addMsg({ ...r, body: r.garbled, foreign_lang:true });
    })
    .on("postgres_changes", { event:"UPDATE", schema:"wow", table:"messages", filter:`channel=eq.${channel}` }, (p)=>{
      updateReplyCount(p.new.id, p.new.reply_count);
    })
    .subscribe((status)=>{
      if (status==="SUBSCRIBED") loadHistory();
      if (status==="CHANNEL_ERROR" || status==="TIMED_OUT") toast("연결이 끊겨서 다시 연결하는 중…");
    });

  if (presence) sb.removeChannel(presence);
  presence = sb.channel("wow-presence-"+channel, { config: { presence: { key: me.id } } });
  presence.on("presence", { event:"sync" }, ()=>{
    let a=0,h=0;
    onlineUsers = new Map();
    Object.values(presence.presenceState()).forEach(list=>{ const p=list[list.length-1]; if(!p) return;
      if (p.faction==="alliance") a++; else h++;
      if (p.id && p.name && p.id!==me.id) onlineUsers.set(p.id, p); });
    $("online").innerHTML = `<b>●</b> ${me.realm||"일반"} 서버 접속 ${a+h}명 · 얼라이언스 ${a} · 호드 ${h}`;
  }).subscribe(async (s)=>{ if (s==="SUBSCRIBED") await presence.track({ id: me.id, faction: me.faction, name: me.name, cls: me.class }); });
}

function enterChat(player){
  me = player; channel = chOf(me.realm);
  cache = []; filterTag = "all";
  show("chat");
  $("srvBadge").textContent = `${me.realm||"일반"} 서버`;
  $("srvBadge").className = "srv"+(me.realm==="PvP"?" pvp":"");
  const fi=document.createElement("span"); fi.className="icons"; fi.id="meIcons";
  fi.appendChild(iconEl("faction", me.faction, me.faction));
  $("meIcons").replaceWith(fi);
  $("meName").textContent = me.name;
  $("meName").style.color = CLASS_COLOR[me.class] || "";
  $("msgInput").placeholder = `${me.realm||"일반"} 서버에 메시지`;
  $("list").innerHTML = '<div class="empty">불러오는 중…</div>';
  buildChips();
  subscribe();
  loadNotifs();
  loadEmotes();
}

$("send").onsubmit = async (ev) => {
  ev.preventDefault();
  const input=$("msgInput"); const body=input.value.trim(); if (!body) return;
  if (body.startsWith("/")){
    const m=body.match(/^\/(\S+)\s*(.*)$/); const key=m?.[1]||""; const target=(m?.[2]||"").replace(/^@/,"").trim();
    if (!EMOTES.some(e=>e.key===key)){ toast("없는 감정 표현이에요. / 를 입력하면 목록이 나와요"); return; }
    input.value="";
    if (!(await sendEmote(key, target))) input.value=body;
    input.focus(); return;
  }
  const tag=$("tagSel").value;
  input.value="";
  const { error } = await sb.rpc("wow_send", { p_token: me.token, p_channel: channel, p_body: body, p_tag: tag, p_parent: null });
  if (error) { toast(errMsg(error)); if (!input.value) input.value=body; return; }
  $("tagSel").value = "chat";
  input.focus();
};

/* ---------- 답글 ---------- */
async function openThread(m){
  threadParent = m.id; threadMsgs = [];
  $("thread").classList.remove("hidden");
  $("tList").innerHTML = ""; $("tList").appendChild(renderMsg(m, true));
  const { data, error } = await sb.rpc("wow_thread", { p_token: me.token, p_parent: m.id });
  if (error) { toast(errMsg(error)); return; }
  if (threadParent !== m.id) return;
  threadMsgs = data;
  renderThread();
  $("tInput").focus();
}
function renderThread(){
  const l=$("tList"); l.innerHTML="";
  threadMsgs.filter((x,i)=>i===0 || !muted.has(x.player_id)).forEach(x=>l.appendChild(renderMsg(x, true)));
  if (threadMsgs.length<=1){ const e=document.createElement("div"); e.className="empty"; e.style.marginTop="16px"; e.textContent="첫 답글을 달아 보세요"; l.appendChild(e); }
  l.scrollTop=l.scrollHeight;
}
function addThreadMsg(m){
  if (threadParent !== m.parent_id || threadMsgs.some(x=>x.id===m.id)) return;
  threadMsgs.push(m); renderThread();
}
$("tBack").onclick = () => { $("thread").classList.add("hidden"); threadParent = null; };
$("tSend").onsubmit = async (ev) => {
  ev.preventDefault();
  const input=$("tInput"); const body=input.value.trim(); if (!body || !threadParent) return;
  if (body.startsWith("/")) { toast("감정 표현은 채팅에서만 할 수 있어요"); return; }
  input.value="";
  const { error } = await sb.rpc("wow_send", { p_token: me.token, p_channel: channel, p_body: body, p_tag: "chat", p_parent: threadParent });
  if (error) { toast(errMsg(error)); if (!input.value) input.value=body; }
  input.focus();
};

/* ---------- 알림함 ---------- */
let notifs = [], notifTimer = null;
const seenKey = () => "wowchat_seen_" + me.id;
function lastSeen(){ return Number(ls.get(seenKey()) || 0); }
async function loadNotifs(){
  if (!me) return;
  const { data, error } = await sb.rpc("wow_notifications", { p_token: me.token, p_limit: 40 });
  if (error || !me) return;
  notifs = data || [];
  const unread = notifs.filter(n => n.id > lastSeen()).length;
  const d = $("bellDot"); d.textContent = unread > 99 ? "99+" : unread; d.classList.toggle("hidden", !unread);
  if (!$("notif").classList.contains("hidden")) renderNotifs();
}
function scheduleNotifs(){ clearTimeout(notifTimer); notifTimer = setTimeout(loadNotifs, 700); }
function renderNotifs(){
  const l=$("nList"); l.innerHTML="";
  if (!notifs.length){ l.innerHTML='<div class="empty">아직 알림이 없어요<br>누가 @로 부르거나 내 글에 답글을 달면 여기 모여요</div>'; return; }
  const seen = Number(ls.get("wowchat_seen_prev_"+me.id) || 0);
  notifs.forEach(n=>{
    const el=document.createElement("div"); el.className="ni"+(n.id>seen?" new":"");
    const k=document.createElement("div"); k.className="k";
    k.textContent = `${n.kind==="mention"?"나를 불렀어요":n.kind==="emote"?"감정 표현":"내 글에 답글"} · ${fmtTime(n.created_at)}`;
    const b=document.createElement("div"); b.className="b"+(n.foreign_lang?" foreign":"");
    const w=document.createElement("b"); w.textContent=n.sender_name; w.style.color=CLASS_COLOR[n.sender_class]||"";
    if (n.kind==="emote") { b.style.color="#ff9f45"; b.textContent=n.body; }
    else b.append(w, document.createTextNode(": "+(n.foreign_lang?`[${LANG[n.sender_faction]}] `:"")+n.body));
    el.append(k,b);
    el.onclick = () => {
      if (n.kind==="emote") { $("notif").classList.add("hidden"); return; }
      const pid = n.parent_id || n.id;
      const p = cache.find(x=>x.id===pid);
      $("notif").classList.add("hidden");
      openThread(p || { id: pid, channel, player_id:null, sender_name:"원래 글", sender_class:"", sender_faction:me.faction,
        sender_race:"", body:"", foreign_lang:false, tag:"chat", parent_id:null, reply_count:0, created_at:n.created_at });
    };
    l.appendChild(el);
  });
}
$("bellBtn").onclick = async () => {
  $("notif").classList.remove("hidden");
  await loadNotifs();
  ls.set("wowchat_seen_prev_"+me.id, String(lastSeen()));
  renderNotifs();
  const max = notifs.reduce((a,n)=>Math.max(a,n.id), lastSeen());
  ls.set(seenKey(), String(max));
  $("bellDot").classList.add("hidden");
};
$("nBack").onclick = () => $("notif").classList.add("hidden");

/* ---------- 내 정보 ---------- */
$("meBtn").onclick = () => {
  const box=$("sheetInfo"); box.innerHTML="";
  const head=document.createElement("div"); head.style.cssText="display:flex;align-items:center;gap:10px;margin-bottom:8px";
  const nm=document.createElement("b"); nm.textContent=me.name; nm.style.color=CLASS_COLOR[me.class]||""; nm.style.fontSize="17px";
  head.append(iconSet(me, true), nm);
  box.appendChild(head);
  [["서버", me.realm || "-"], ["종족·직업", `${me.race} ${me.class}`], ["레벨", me.level || "-"],
   ["진영", me.faction==="alliance" ? "얼라이언스 (공용어)" : "호드 (오크어)"]].forEach(([k,v])=>{
    const d=document.createElement("div"); const b=document.createElement("span");
    b.style.color="var(--muted)"; b.textContent=k+"  "; d.append(b, document.createTextNode(v)); box.appendChild(d);
  });
  $("sheet").classList.remove("hidden");
};
$("closeSheet").onclick = () => $("sheet").classList.add("hidden");
$("sheet").onclick = (e) => { if (e.target.id==="sheet") $("sheet").classList.add("hidden"); };
function leaveChat(){
  if (msgSub) sb.removeChannel(msgSub); if (presence) sb.removeChannel(presence);
  msgSub=presence=null; me=null;
  $("sheet").classList.add("hidden"); $("thread").classList.add("hidden");
  $("prof").classList.add("hidden"); $("newBar").classList.add("hidden"); $("notif").classList.add("hidden");
}
$("switchBtn").onclick = async () => {
  leaveChat(); ls.del("wowchat_token");
  if (!(await openPickerFromAccount())) { show("join"); showAlt(); }
};
$("logoutBtn").onclick = () => {
  leaveChat(); ls.del("wowchat_token"); ls.del("wowchat_account");
  show("join"); showAlt();
};

/* ---------- 시작 ---------- */
(async () => {
  const params = new URLSearchParams(location.search);
  if (params.has("code") || params.has("error")) { await handleBnetReturn(params); return; }
  const tok = ls.get("wowchat_token");
  if (tok) {
    const { data } = await sb.rpc("wow_me", { p_token: tok });
    if (data) { enterChat(data); return; }
    ls.del("wowchat_token");
  }
  if (await openPickerFromAccount()) return;
  show("join");
})();
</script>
