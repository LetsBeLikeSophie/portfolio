<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>포에버 채팅</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0b09; --panel:#17130f; --panel2:#1f1a14; --line:#3a2f22;
    --gold:#e6c36a; --gold-dim:#a88b45; --text:#ece4d6; --muted:#9b8f7c;
    --alliance:#3f7fd9; --horde:#c8372d; --danger:#ff6b5b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:"Noto Sans KR",system-ui,sans-serif;-webkit-text-size-adjust:100%}
  body{background:radial-gradient(1200px 600px at 50% -200px,#2a1f12 0%,var(--bg) 70%)}
  button,input,select{font:inherit;color:inherit}
  .hidden{display:none!important}

  /* ---------- 입장 ---------- */
  #join{min-height:100%;display:flex;align-items:center;justify-content:center;
    padding:calc(24px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom))}
  .card{width:100%;max-width:420px;background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--line);border-radius:14px;padding:22px 20px;
    box-shadow:0 0 0 1px #0006 inset,0 20px 60px #0008}
  .logo{font-family:Cinzel,serif;color:var(--gold);font-size:28px;letter-spacing:.06em;text-align:center;margin:0}
  .sub{color:var(--muted);text-align:center;font-size:13px;margin:6px 0 18px}
  .seg{display:flex;background:#0006;border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:16px}
  .seg button{flex:1;border:0;background:none;padding:9px 0;border-radius:8px;color:var(--muted);cursor:pointer}
  .seg button.on{background:var(--panel2);color:var(--gold);box-shadow:0 0 0 1px var(--line)}
  label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}
  input,select{width:100%;background:#0a0806;border:1px solid var(--line);border-radius:9px;
    padding:11px 12px;outline:none;font-size:16px}
  input:focus,select:focus{border-color:var(--gold-dim)}
  .row{display:flex;gap:10px}.row>div{flex:1}
  .btn{width:100%;margin-top:18px;border:1px solid #8a6a26;border-radius:10px;padding:12px;cursor:pointer;
    background:linear-gradient(180deg,#c9a24c,#8c6b25);color:#1a1205;font-weight:700;letter-spacing:.02em}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.ghost{background:none;color:var(--gold);border-color:var(--line);font-weight:500}
  .note{font-size:12.5px;color:var(--muted);margin-top:12px;line-height:1.5}
  .err{color:var(--danger);font-size:13px;margin-top:10px;min-height:1em}
  .found{margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#0005;font-size:14px}

  /* ---------- 채팅 ---------- */
  #chat{position:fixed;inset:0;display:flex;flex-direction:column}
  header{padding:calc(10px + env(safe-area-inset-top)) 14px 0;background:linear-gradient(180deg,#1b150e,#120e0a);
    border-bottom:1px solid var(--line)}
  .top{display:flex;align-items:center;gap:10px}
  .title{font-family:Cinzel,serif;color:var(--gold);font-size:18px;letter-spacing:.05em;flex:1}
  .me{display:flex;align-items:center;gap:8px;font-size:13px;background:#0006;border:1px solid var(--line);
    padding:5px 10px 5px 6px;border-radius:999px;cursor:pointer;max-width:60%}
  .me span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .crest{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff}
  .crest.alliance{background:var(--alliance)} .crest.horde{background:var(--horde)}
  .tabs{display:flex;gap:4px;margin-top:10px}
  .tab{flex:1;border:0;background:none;padding:10px 0 11px;color:var(--muted);cursor:pointer;position:relative;font-weight:500}
  .tab.on{color:var(--gold)}
  .tab.on::after{content:"";position:absolute;left:20%;right:20%;bottom:-1px;height:2px;background:var(--gold);border-radius:2px}
  .tab .dot{display:inline-block;min-width:16px;padding:0 5px;height:16px;line-height:16px;border-radius:8px;
    background:var(--danger);color:#fff;font-size:10px;margin-left:5px;vertical-align:1px}
  .online{font-size:11.5px;color:var(--muted);text-align:center;padding:6px 0 8px}
  .online b{color:#7bd17b;font-weight:500}

  #list{flex:1;overflow-y:auto;padding:10px 12px;-webkit-overflow-scrolling:touch;
    font-size:15px;line-height:1.5}
  .msg{padding:3px 0;word-break:break-word}
  .msg .time{color:#6d6354;font-size:11px;margin-right:6px}
  .msg .who{font-weight:700;cursor:default}
  .msg .meta{color:#6d6354;font-size:11px;margin-left:4px}
  .msg .lang{color:var(--muted);font-style:italic;margin-right:4px}
  .msg.foreign .text{font-style:italic;color:#c9bda7}
  .msg.pvp-ch .text{}
  .sys{color:#e0b34a;font-size:13px;text-align:center;padding:8px 0;opacity:.85}
  .empty{color:var(--muted);text-align:center;margin-top:40px;font-size:14px}

  form#send{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);background:#120e0a}
  form#send input{flex:1}
  form#send button{border:1px solid #8a6a26;border-radius:9px;padding:0 16px;
    background:linear-gradient(180deg,#c9a24c,#8c6b25);color:#1a1205;font-weight:700;cursor:pointer}
  .toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);
    background:#2a1d10;border:1px solid var(--gold-dim);padding:8px 14px;border-radius:9px;font-size:13px;
    opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
  .toast.show{opacity:1}

  /* 시트 */
  #sheet{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:5}
  #sheet .card{border-radius:14px 14px 0 0;padding-bottom:calc(22px + env(safe-area-inset-bottom))}
</style>
</head>
<body>

<!-- 입장 화면 -->
<section id="join" class="hidden">
  <div class="card">
    <h1 class="logo">FOREVER CHAT</h1>
    <p class="sub">와우 포에버 실시간 채팅</p>

    <div class="seg">
      <button type="button" data-mode="lookup" class="on">캐릭터 조회</button>
      <button type="button" data-mode="manual">직접 입력</button>
    </div>

    <div id="lookupBox">
      <div class="row">
        <div><label for="lkRealm">서버</label><select id="lkRealm"><option value="일반">일반</option><option value="PvP">PvP</option></select></div>
        <div><label for="lkName">캐릭터 이름 (이름 성)</label><input id="lkName" placeholder="예: 아서 로드리" autocomplete="off"></div>
      </div>
      <button class="btn" id="lkBtn" type="button">불러오기</button>
      <div class="err" id="lkErr"></div>
    </div>

    <form id="manualBox" class="hidden" autocomplete="off">
      <div class="row">
        <div><label for="fName">캐릭터 이름</label><input id="fName" maxlength="24" required></div>
        <div><label for="fRealm">서버</label><select id="fRealm"><option value="일반">일반</option><option value="PvP">PvP</option></select></div>
      </div>
      <label for="fRace">종족</label>
      <select id="fRace" required></select>
      <div class="row">
        <div><label for="fClass">직업</label><select id="fClass" required></select></div>
        <div style="flex:.6"><label for="fLevel">레벨</label><input id="fLevel" type="number" min="1" max="100" inputmode="numeric" placeholder="선택"></div>
      </div>
      <input type="hidden" id="fFaction">
      <button class="btn" type="submit" id="joinBtn">입장하기</button>
      <div class="err" id="joinErr"></div>
      <p class="note">다른 진영 사람이 쓴 채팅은 게임처럼 <b>공용어 / 오크어</b>로 바뀌어 보여요. 원문은 같은 진영에게만 전달돼요.</p>
    </form>
  </div>
</section>

<!-- 채팅 화면 -->
<section id="chat" class="hidden">
  <header>
    <div class="top">
      <div class="title">FOREVER</div>
      <button class="me" id="meBtn" type="button"><div class="crest" id="meCrest"></div><span id="meName"></span></button>
    </div>
    <div class="tabs">
      <button class="tab on" data-ch="general" type="button">일반<span class="dot hidden" id="dot-general"></span></button>
      <button class="tab" data-ch="pvp" type="button">PvP<span class="dot hidden" id="dot-pvp"></span></button>
    </div>
  </header>
  <div class="online" id="online">접속 중…</div>
  <div id="list"></div>
  <form id="send" autocomplete="off">
    <input id="msgInput" maxlength="300" placeholder="메시지 입력" enterkeyhint="send">
    <button type="submit">전송</button>
  </form>
</section>

<div id="sheet" class="hidden">
  <div class="card">
    <div id="sheetInfo" style="font-size:15px;line-height:1.7"></div>
    <button class="btn ghost" id="switchBtn" type="button">다른 캐릭터로 입장</button>
    <button class="btn ghost" id="closeSheet" type="button" style="margin-top:8px">닫기</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL = "https://ztxzqvnybiemgbhtrwiw.supabase.co";
const SUPABASE_KEY = "sb_publishable_RaScKFLELmXHL62XXB5MMg_06cXrYj7";
const sb = createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false } });

const RACES = {
  alliance: ["인간", "드워프", "노움", "나이트 엘프", "고등 마법원 스카이본"],
  horde: ["오크", "언데드", "타우렌", "트롤", "바람구체자 스카이본"],
};
const CLASSES = ["전사","성기사","사냥꾼","도적","사제","주술사","마법사","흑마법사","드루이드"];
const CLASS_COLOR = { "전사":"#C69B6D","성기사":"#F48CBA","사냥꾼":"#AAD372","도적":"#FFF468","사제":"#FFFFFF",
  "주술사":"#0070DD","마법사":"#3FC7EB","흑마법사":"#8788EE","드루이드":"#FF7C0A" };
const LANG = { alliance: "공용어", horde: "오크어" };
const CH_NAME = { general: "일반", pvp: "PvP" };

const $ = (id) => document.getElementById(id);
const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch {} },
  del(k){ try { localStorage.removeItem(k); } catch {} },
};

let me = null;
let current = "general";
const cache = { general: [], pvp: [] };  // 채널별 메시지
const loaded = { general: false, pvp: false };
const unread = { general: 0, pvp: 0 };
let msgChannel = null, presence = null;

function toast(t){ const el=$("toast"); el.textContent=t; el.classList.add("show");
  clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove("show"),2200); }
function errMsg(e){ return (e && (e.message || e.error_description)) || String(e); }

/* ---------- 입장 폼 ---------- */
function fillSelects(){
  const r=$("fRace"); r.innerHTML="";
  for (const [fac, list] of Object.entries(RACES)) {
    const g=document.createElement("optgroup"); g.label = fac==="alliance"?"얼라이언스":"호드";
    list.forEach(x=>{ const o=document.createElement("option"); o.value=x; o.textContent=x; o.dataset.faction=fac; g.appendChild(o); });
    r.appendChild(g);
  }
  const c=$("fClass"); c.innerHTML="";
  CLASSES.forEach(x=>{ const o=document.createElement("option"); o.value=x; o.textContent=x; c.appendChild(o); });
}
function setMode(mode){
  document.querySelectorAll(".seg button").forEach(b=>b.classList.toggle("on", b.dataset.mode===mode));
  $("lookupBox").classList.toggle("hidden", mode!=="lookup");
  $("manualBox").classList.toggle("hidden", mode!=="manual");
}
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));

$("lkBtn").onclick = async () => {
  const realm=$("lkRealm").value.trim(), name=$("lkName").value.trim();
  $("lkErr").textContent="";
  if(!realm||!name){ $("lkErr").textContent="서버와 캐릭터 이름을 입력해 주세요"; return; }
  $("lkBtn").disabled=true; $("lkBtn").textContent="불러오는 중…";
  try{
    const r = await fetch(`${SUPABASE_URL}/functions/v1/wow-character?realm=${encodeURIComponent(realm)}&name=${encodeURIComponent(name)}`,
      { headers: { apikey: SUPABASE_KEY } });
    const d = await r.json();
    if (d.ok) {
      const c = d.character;
      $("fName").value = name.replace(/-/g, " ");
      $("fRealm").value = c.ruleset ? (/pvp/i.test(c.ruleset) ? "PvP" : "일반") : realm;
      if (c.level) $("fLevel").value = c.level;
      const known = [...$("fRace").options].find(o=>o.value===c.race);
      if (!known && c.race) {
        const o=document.createElement("option"); o.value=c.race; o.textContent=c.race; o.dataset.faction=c.faction||"";
        $("fRace").appendChild(o);
      }
      if (c.race) $("fRace").value = c.race;
      if (c.class && CLASSES.includes(c.class)) $("fClass").value = c.class;
      $("fFaction").value = c.faction || "";
      setMode("manual");
      toast(`${c.name} · ${c.race} ${c.class} 불러왔어요`);
    } else if (d.reason === "not_configured") {
      $("fName").value=name; $("fRealm").value=realm;
      setMode("manual");
      toast("캐릭터 조회가 아직 연결 안 됐어요. 종족·직업을 골라 주세요");
    } else {
      $("lkErr").textContent = (d.message || "조회에 실패했어요") + " · 직접 입력으로 들어갈 수 있어요";
    }
  }catch(e){ $("lkErr").textContent="조회 중 오류: "+errMsg(e); }
  finally{ $("lkBtn").disabled=false; $("lkBtn").textContent="불러오기"; }
};

$("manualBox").onsubmit = async (ev) => {
  ev.preventDefault();
  $("joinErr").textContent=""; $("joinBtn").disabled=true;
  const opt = $("fRace").selectedOptions[0];
  const lv = parseInt($("fLevel").value,10);
  const { data, error } = await sb.rpc("wow_register", {
    p_name: $("fName").value.trim(), p_realm: $("fRealm").value.trim(),
    p_race: $("fRace").value, p_class: $("fClass").value,
    p_level: Number.isFinite(lv) ? lv : null,
    p_faction: $("fFaction").value || opt?.dataset.faction || null,
  });
  $("joinBtn").disabled=false;
  if (error) { $("joinErr").textContent = errMsg(error); return; }
  store.set("wowchat_token", data.token);
  enterChat(data);
};

/* ---------- 채팅 ---------- */
function fmtTime(iso){ const d=new Date(iso); return d.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",hour12:false}); }

function renderMsg(m){
  const el=document.createElement("div");
  el.className="msg"+(m.foreign_lang?" foreign":"");
  const t=document.createElement("span"); t.className="time"; t.textContent=fmtTime(m.created_at);
  const crest=document.createElement("span"); crest.className="crest "+m.sender_faction;
  crest.style.cssText="display:inline-grid;width:15px;height:15px;font-size:8px;margin-right:4px;vertical-align:-2px";
  crest.textContent = m.sender_faction==="alliance"?"얼":"호";
  const who=document.createElement("span"); who.className="who"; who.style.color=CLASS_COLOR[m.sender_class]||"#ddd";
  who.textContent=`[${m.sender_name}]`;
  who.title=`${m.sender_realm||""} ${m.sender_level?("Lv."+m.sender_level+" "):""}${m.sender_race} ${m.sender_class}`.trim();
  const meta=document.createElement("span"); meta.className="meta";
  meta.textContent = `${m.sender_level?("Lv"+m.sender_level+" "):""}${m.sender_race}`;
  const colon=document.createTextNode(": ");
  el.append(t, crest, who, meta, colon);
  if (m.foreign_lang){ const l=document.createElement("span"); l.className="lang"; l.textContent=`[${LANG[m.sender_faction]}]`; el.appendChild(l); }
  const tx=document.createElement("span"); tx.className="text"; tx.textContent=m.body; el.appendChild(tx);
  return el;
}
function nearBottom(){ const l=$("list"); return l.scrollHeight - l.scrollTop - l.clientHeight < 120; }
function scrollBottom(){ const l=$("list"); l.scrollTop=l.scrollHeight; }

function renderAll(){
  const l=$("list"); l.innerHTML="";
  const arr=cache[current];
  if (!arr.length){ const e=document.createElement("div"); e.className="empty";
    e.textContent = loaded[current] ? `${CH_NAME[current]} 채널의 첫 메시지를 남겨 보세요` : "불러오는 중…"; l.appendChild(e); return; }
  const frag=document.createDocumentFragment(); arr.forEach(m=>frag.appendChild(renderMsg(m))); l.appendChild(frag);
  scrollBottom();
}
function addMsg(m){
  const arr=cache[m.channel];
  if (arr.some(x=>x.id===m.id)) return;
  arr.push(m); if (arr.length>300) arr.splice(0, arr.length-300);
  if (m.channel===current){
    const stick=nearBottom() || m.player_id===me.id;
    const l=$("list"); const empty=l.querySelector(".empty"); if (empty) empty.remove();
    l.appendChild(renderMsg(m)); if (stick) scrollBottom();
  } else {
    unread[m.channel]++; updateDots();
  }
}
function updateDots(){
  for (const ch of ["general","pvp"]) {
    const d=$("dot-"+ch); d.textContent = unread[ch]>99?"99+":unread[ch];
    d.classList.toggle("hidden", !unread[ch]);
  }
}

async function loadHistory(ch){
  const { data, error } = await sb.rpc("wow_history", { p_token: me.token, p_channel: ch, p_limit: 120 });
  if (error) { toast("불러오기 실패: "+errMsg(error)); return; }
  const existing = new Map(cache[ch].map(x=>[x.id,x]));
  data.reverse().forEach(m=>existing.set(m.id,m));
  cache[ch] = [...existing.values()].sort((a,b)=>a.id-b.id);
  loaded[ch]=true;
  if (ch===current) renderAll();
}

function switchChannel(ch){
  current=ch; unread[ch]=0; updateDots();
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on", b.dataset.ch===ch));
  $("msgInput").placeholder = `${CH_NAME[ch]} 채널에 메시지 입력`;
  renderAll();
  if (!loaded[ch]) loadHistory(ch);
  if (presence) presence.track({ id: me.id, name: me.name, faction: me.faction, ch }).catch(()=>{});
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>switchChannel(b.dataset.ch));

// 같은 진영 원문은 묶어서 가져오기
let pendingIds=[], pendingRows=new Map(), flushTimer=null;
function queueOwnFaction(row){
  pendingIds.push(row.id); pendingRows.set(row.id,row);
  if (!flushTimer) flushTimer=setTimeout(flushBodies, 60);
}
async function flushBodies(){
  const ids=pendingIds; const rows=pendingRows; pendingIds=[]; pendingRows=new Map(); flushTimer=null;
  const { data, error } = await sb.rpc("wow_bodies", { p_token: me.token, p_ids: ids });
  const map=new Map((data||[]).map(x=>[x.id,x.body]));
  ids.forEach(id=>{
    const r=rows.get(id);
    if (map.has(id)) addMsg({ ...r, body: map.get(id), foreign_lang:false });
    else if (error) addMsg({ ...r, body: r.garbled, foreign_lang:false });
  });
}

function subscribe(){
  if (msgChannel) sb.removeChannel(msgChannel);
  msgChannel = sb.channel("wow-messages")
    .on("postgres_changes", { event:"INSERT", schema:"wow", table:"messages" }, (p)=>{
      const r=p.new;
      if (r.sender_faction===me.faction) queueOwnFaction(r);
      else addMsg({ ...r, body: r.garbled, foreign_lang:true });
    })
    .subscribe((status)=>{
      if (status==="SUBSCRIBED") { loadHistory(current); if (current!=="general") loaded.general=false; if (current!=="pvp") loaded.pvp=false; }
      if (status==="CHANNEL_ERROR" || status==="TIMED_OUT") toast("연결이 끊겼어요. 다시 연결 중…");
    });

  if (presence) sb.removeChannel(presence);
  presence = sb.channel("wow-presence", { config: { presence: { key: me.id } } });
  presence.on("presence", { event:"sync" }, ()=>{
    const st=presence.presenceState(); let a=0,h=0,here=0;
    Object.values(st).forEach(list=>{ const p=list[list.length-1]; if(!p) return;
      if (p.faction==="alliance") a++; else h++; if (p.ch===current) here++; });
    $("online").innerHTML = `<b>●</b> 접속 ${a+h}명 · 얼라이언스 ${a} · 호드 ${h}`;
  }).subscribe(async (s)=>{ if (s==="SUBSCRIBED") await presence.track({ id: me.id, name: me.name, faction: me.faction, ch: current }); });
}

function enterChat(player){
  me = player;
  $("join").classList.add("hidden"); $("chat").classList.remove("hidden");
  const crest=$("meCrest"); crest.className="crest "+me.faction; crest.textContent = me.faction==="alliance"?"얼":"호";
  $("meName").textContent = `${me.name} · ${me.race} ${me.class}`;
  $("meName").style.color = CLASS_COLOR[me.class] || "";
  cache.general=[]; cache.pvp=[]; loaded.general=loaded.pvp=false; unread.general=unread.pvp=0; updateDots();
  switchChannel(me.realm === "PvP" ? "pvp" : "general");
  subscribe();
}

$("send").onsubmit = async (ev) => {
  ev.preventDefault();
  const input=$("msgInput"); const body=input.value.trim();
  if (!body) return;
  input.value="";
  const { error } = await sb.rpc("wow_send", { p_token: me.token, p_channel: current, p_body: body });
  if (error) { toast(errMsg(error)); if (!input.value) input.value=body; }
  input.focus();
};

$("meBtn").onclick = () => {
  $("sheetInfo").innerHTML = "";
  const lines = [
    ["캐릭터", me.name], ["서버", me.realm || "-"], ["종족", me.race], ["직업", me.class],
    ["레벨", me.level || "-"], ["진영", me.faction==="alliance" ? "얼라이언스 (공용어)" : "호드 (오크어)"],
  ];
  lines.forEach(([k,v])=>{ const d=document.createElement("div"); const b=document.createElement("span");
    b.style.color="var(--muted)"; b.textContent=k+"  "; d.append(b, document.createTextNode(v)); $("sheetInfo").appendChild(d); });
  $("sheet").classList.remove("hidden");
};
$("closeSheet").onclick = () => $("sheet").classList.add("hidden");
$("sheet").onclick = (e) => { if (e.target.id==="sheet") $("sheet").classList.add("hidden"); };
$("switchBtn").onclick = () => {
  store.del("wowchat_token");
  if (msgChannel) sb.removeChannel(msgChannel); if (presence) sb.removeChannel(presence);
  msgChannel=presence=null; me=null;
  $("sheet").classList.add("hidden"); $("chat").classList.add("hidden"); $("join").classList.remove("hidden");
  setMode("lookup");
};

/* ---------- 시작 ---------- */
fillSelects();
(async () => {
  const tok = store.get("wowchat_token");
  if (tok) {
    const { data } = await sb.rpc("wow_me", { p_token: tok });
    if (data) { enterChat(data); return; }
    store.del("wowchat_token");
  }
  $("join").classList.remove("hidden");
})();
</script>
</body>
