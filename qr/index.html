<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QR 만들기</title>
<meta name="description" content="글이나 링크를 적으면 바로 QR 코드로 만들어줘요. 폰 카메라로 찍으면 적은 내용이 그대로 나와요. 이미지로 저장할 수 있어요.">
<link rel="canonical" href="https://itssophie.dev/qr/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://itssophie.dev/qr/">
<meta property="og:title" content="QR 만들기">
<meta property="og:description" content="적으면 바로 QR 코드로. 폰 카메라로 찍으면 적은 내용이 그대로 나와요.">
<script>
  (function () {
    try {
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  :root {
    --paper: #f3f5f2; --paper-2: #e9eee9; --ink: #17201c; --dim: #5b6862;
    --line: #cfd8d2; --green: #1e6b4f; --mark: #cdeeb6; --mark-ink: #17201c;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #121815; --paper-2: #18201c; --ink: #e4ece7; --dim: #8d9b94;
      --line: #2c3833; --green: #6cc79a; --mark: #2b5a40; --mark-ink: #eaf7ef;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #121815; --paper-2: #18201c; --ink: #e4ece7; --dim: #8d9b94;
    --line: #2c3833; --green: #6cc79a; --mark: #2b5a40; --mark-ink: #eaf7ef;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    -webkit-text-size-adjust: 100%;
    line-height: 1.5;
  }
  button, textarea { font: inherit; color: inherit; }
  .wrap {
    max-width: 520px; margin: 0 auto;
    padding: calc(28px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));
  }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
  h1 { margin: 0; font-size: 26px; letter-spacing: -0.02em; }
  .lead { margin: 0 0 22px; color: var(--dim); font-size: 15px; }
  .theme {
    border: 1px solid var(--line); background: var(--paper-2); border-radius: 999px;
    width: 38px; height: 38px; cursor: pointer; display: grid; place-items: center; color: var(--ink);
  }

  label { display: block; font-size: 13px; color: var(--dim); margin-bottom: 6px; }
  textarea {
    width: 100%; min-height: 110px; resize: vertical;
    background: var(--paper-2); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; font-size: 16px; outline: none;
  }
  textarea:focus { border-color: var(--green); }
  .meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--dim); margin-top: 6px; }
  .meta button { border: 0; background: none; padding: 0; color: var(--dim); cursor: pointer; text-decoration: underline; }

  .stage {
    margin-top: 20px; border: 1px solid var(--line); border-radius: 16px; background: var(--paper-2);
    padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 14px;
  }
  .qrbox {
    width: min(100%, 300px); aspect-ratio: 1; border-radius: 12px; background: #fff;
    display: grid; place-items: center; overflow: hidden;
  }
  .qrbox canvas { width: 100%; height: 100%; image-rendering: pixelated; display: block; }
  .empty { color: #8d9b94; font-size: 14px; text-align: center; padding: 20px; }
  .err { color: #c0392b; }

  .actions { display: flex; gap: 8px; width: 100%; }
  .btn {
    flex: 1; border: 1px solid var(--line); background: var(--paper); border-radius: 10px;
    padding: 11px 10px; cursor: pointer; font-weight: 600; font-size: 15px;
  }
  .btn.primary { background: var(--green); border-color: var(--green); color: var(--paper); }
  .btn:disabled { opacity: .45; cursor: default; }

  .tip { margin: 18px 0 0; font-size: 13px; color: var(--dim); }
  .tip b { color: var(--ink); font-weight: 600; }
  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px);
    background: var(--ink); color: var(--paper); padding: 9px 14px; border-radius: 999px; font-size: 14px;
    opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none;
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  footer { margin-top: 28px; font-size: 12px; color: var(--dim); }
  footer a { color: var(--dim); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>QR 만들기</h1>
    <button class="theme" id="theme" type="button" aria-label="테마 바꾸기"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>
  </header>
  <p class="lead">적으면 바로 QR이 돼요. 폰 카메라로 찍으면 적은 내용이 그대로 나와요.</p>

  <label for="text">QR에 넣을 내용</label>
  <textarea id="text" placeholder="예) https://itssophie.dev&#10;예) 와이파이 비밀번호는 1234abcd 입니다" autocomplete="off" spellcheck="false"></textarea>
  <div class="meta">
    <span id="count">0자</span>
    <button type="button" id="clear">지우기</button>
  </div>

  <div class="stage">
    <div class="qrbox" id="qrbox"><div class="empty">위에 내용을 적어주세요</div></div>
    <div class="actions">
      <button class="btn primary" id="save" type="button" disabled>이미지 저장</button>
      <button class="btn" id="share" type="button" disabled>공유</button>
    </div>
  </div>

  <p class="tip">
    <b>링크</b>(https://…)를 적으면 찍었을 때 바로 열 수 있어요. 그냥 <b>글</b>을 적으면 카메라에 글이 그대로 보여요.
    적은 내용은 이 기기 안에서만 QR로 바뀌고 어디에도 보내지 않아요.
  </p>
  <footer><a href="/">itssophie.dev</a></footer>
</div>
<div class="toast" id="toast"></div>

<script src="/qr/qrcode.js"></script>
<script>
(function () {
  var MAX_BYTES = 2900; // 오류 정정 L 기준 최대(2953)보다 살짝 여유

  var $ = function (id) { return document.getElementById(id); };
  var text = $('text'), box = $('qrbox'), count = $('count');
  var saveBtn = $('save'), shareBtn = $('share');
  var canvas = null;

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];

  function byteLen(s) { return new TextEncoder().encode(s).length; }

  // 내용이 짧으면 오류 정정을 높게(찍기 쉬움), 길면 낮춰서 들어가게
  function makeQR(s) {
    var levels = ['M', 'L'];
    if (byteLen(s) < 300) levels.unshift('Q');
    for (var i = 0; i < levels.length; i++) {
      try {
        var qr = qrcode(0, levels[i]);
        qr.addData(s, 'Byte');
        qr.make();
        return qr;
      } catch (e) { /* 다음 레벨로 */ }
    }
    return null;
  }

  function draw(qr) {
    var n = qr.getModuleCount(), quiet = 4, scale = Math.max(4, Math.ceil(1024 / (n + quiet * 2)));
    var size = (n + quiet * 2) * scale;
    var c = document.createElement('canvas');
    c.width = c.height = size;
    var g = c.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, size, size);
    g.fillStyle = '#000';
    for (var r = 0; r < n; r++)
      for (var col = 0; col < n; col++)
        if (qr.isDark(r, col)) g.fillRect((col + quiet) * scale, (r + quiet) * scale, scale, scale);
    c.setAttribute('role', 'img');
    c.setAttribute('aria-label', 'QR 코드');
    return c;
  }

  function setEmpty(msg, isErr) {
    canvas = null;
    box.innerHTML = '<div class="empty' + (isErr ? ' err' : '') + '"></div>';
    box.firstChild.textContent = msg;
    saveBtn.disabled = shareBtn.disabled = true;
  }

  var timer = null;
  function update() {
    var s = text.value;
    var b = byteLen(s);
    count.textContent = s.length + '자' + (b > 0 ? ' · ' + b + '바이트' : '');
    try { localStorage.setItem('qr-text', s); } catch (e) {}
    if (!s.trim()) return setEmpty('위에 내용을 적어주세요');
    if (b > MAX_BYTES) return setEmpty('너무 길어요. 한글 기준 약 900자까지 들어가요.', true);
    var qr = makeQR(s);
    if (!qr) return setEmpty('너무 길어서 QR에 다 안 들어가요.', true);
    canvas = draw(qr);
    box.innerHTML = '';
    box.appendChild(canvas);
    saveBtn.disabled = false;
    shareBtn.disabled = false;
  }

  text.addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(update, 120); });
  $('clear').addEventListener('click', function () { text.value = ''; update(); text.focus(); });

  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('on'); }, 1600);
  }

  function fileName() {
    var d = new Date(), p = function (x) { return String(x).padStart(2, '0'); };
    return 'qr-' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()) + '.png';
  }

  function toBlob() { return new Promise(function (res) { canvas.toBlob(res, 'image/png'); }); }

  saveBtn.addEventListener('click', function () {
    if (!canvas) return;
    var a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = fileName();
    document.body.appendChild(a); a.click(); a.remove();
    toast('저장했어요');
  });

  shareBtn.addEventListener('click', function () {
    if (!canvas) return;
    toBlob().then(function (blob) {
      var file = new File([blob], fileName(), { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        return navigator.share({ files: [file], title: 'QR 코드' }).catch(function () {});
      }
      if (navigator.clipboard && window.ClipboardItem) {
        return navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
          .then(function () { toast('이미지를 복사했어요'); })
          .catch(function () { toast('이 브라우저는 공유가 안 돼요. 저장을 써주세요'); });
      }
      toast('이 브라우저는 공유가 안 돼요. 저장을 써주세요');
    });
  });

  // 테마
  $('theme').addEventListener('click', function () {
    var root = document.documentElement;
    var cur = root.getAttribute('data-theme') ||
      (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    var next = cur === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch (e) {}
  });

  // 주소에 ?t=내용 이 있으면 그걸로, 아니면 지난번 내용
  var init = new URLSearchParams(location.search).get('t');
  if (init == null) { try { init = localStorage.getItem('qr-text') || ''; } catch (e) { init = ''; } }
  text.value = init;
  update();
})();
</script>
</body>
</html>
